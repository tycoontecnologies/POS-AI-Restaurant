name: Next.js POS validation
on:
  pull_request:
    paths:
      - "nextjs-pos/**"
  push:
    branches:
      - nextjs-pos-rebuild
    paths:
      - "nextjs-pos/**"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-pos
    steps:
      - name: Checkout source without broken legacy submodule hook
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-pos/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
